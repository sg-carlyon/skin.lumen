name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate skin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kodi-addon-checker
        run: pip install kodi-addon-checker==0.0.36
      - name: Run checks
        run: python .github/scripts/check_skin.py
